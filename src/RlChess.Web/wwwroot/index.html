<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Play chess in your browser against a computer or a friend. rlChess: a C# chess engine built for reinforcement learning." />
    <meta name="theme-color" content="#161512" />
    <title>rlChess</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="pieces/wN.svg" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <div class="bar"><i></i></div>
            <div>Setting up the board…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
