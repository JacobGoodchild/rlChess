name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RlChess.sln

      - name: Build
        run: dotnet build RlChess.sln -c Release --no-restore

      - name: Test (fast suite)
        run: dotnet test RlChess.sln -c Release --no-build --filter "Category!=Slow"

      - name: Publish website
        run: dotnet publish src/RlChess.Web/RlChess.Web.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          cd publish/wwwroot
          # The site lives at /rlChess/, not at the domain root.
          sed -i 's|<base href="/" />|<base href="/rlChess/" />|' index.html
          grep -q '<base href="/rlChess/" />' index.html
          # Stop Jekyll hiding the _framework folder.
          touch .nojekyll
          # Fallback so refreshing a deep link still loads the app.
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
